<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tokoku - Fashion & Aksesoris</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-content">
    <header class="topbar">
      <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">T</span>Tokoku</a>

      <form id="form-cari" class="search-box">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 4.5 4.5"/></svg>
        <input id="kata" type="search" aria-label="Cari produk" placeholder="Cari jaket, celana, topi..." autocomplete="off">
        <button type="submit">Cari produk</button>
      </form>

      <div class="topbar-actions">
        <button id="btn-urut" class="sort-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"/></svg>
          Urutkan harga
        </button>
        <button id="btn-reset" class="reset-button" type="button">Reset</button>
      </div>
    </header>

    <main>
      <section class="compact-hero">
        <div>
          <p class="eyebrow">Koleksi pilihan Tokoku</p>
          <h1>Fashion santai, warna manis.</h1>
          <p>Pakaian dan aksesori pilihan untuk menemani hari dengan gaya yang ringan.</p>
        </div>
        <span class="engine-badge"><i></i><span id="badge">Memuat mesin C++...</span></span>
      </section>

      <section class="catalog" aria-label="Katalog produk">
        <div class="catalog-status">
          <div>
            <span id="status-dot" class="status-dot"></span>
            <p id="status"></p>
          </div>
          <span id="status-metode">Data awal</span>
        </div>
        <div id="grid" class="product-grid"></div>
      </section>
    </main>

    <footer>
      <span>Tokoku</span>
      <span>Eksperimen Sorting &amp; Searching</span>
    </footer>
  </div>

  <aside id="panel" class="log-panel" aria-label="Log algoritma" aria-hidden="true">
    <div class="log-header">
      <div>
        <span id="panel-kicker" class="log-kicker"></span>
        <h2 id="panel-judul">Log</h2>
      </div>
      <button id="panel-tutup" class="close-button" type="button" aria-label="Tutup panel log">
        <span aria-hidden="true">×</span> Tutup
      </button>
    </div>
    <div class="log-content">
      <div id="ringkasan" class="summary-grid"></div>
      <div class="log-actions">
        <button id="btn-putar" type="button">Ⅱ Jeda</button>
        <button id="btn-lompat" type="button">» Lompat ke hasil</button>
        <button id="btn-unduh" type="button">↓ Unduh log (.txt)</button>
      </div>
      <div id="legenda" class="log-legend"></div>
      <div id="langkah" class="log-groups"></div>
    </div>
  </aside>

  <script src="js/engine.js"></script>
  <script src="js/urutan.js"></script>
  <script src="js/tampilan-katalog.js"></script>
  <script src="js/panel-log.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
